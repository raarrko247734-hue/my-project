<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Таймер обратного отсчета</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 id="title">Таймер обратного отсчета</h1>

        <input type="number" id="secondsInput" placeholder="Введите секунды" min="1">

        <button id="startBtn">Старт</button>
        <button id="stopBtn">Стоп</button>
        <button id="resumeBtn">Продолжить</button>

    </div>

    <script src="script.js"></script>
</body>
</html>
