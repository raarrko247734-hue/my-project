<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Угадай число</title>
</head>
<body>
    <h1>Угадай число от 1 до 10</h1>
    <button id="playBtn">Играть</button>
    <p id="result"></p>
    <button id="playAgainBtn" style="display:none;">Играть снова</button>   
    <script>
   const randomNumber = Math.floor(Math.random() * 10) + 1;
const userGuess = parseInt(prompt("Угадайте число от 1 до 10:"));

if (userGuess === randomNumber) {
    alert("Поздравляю! Ты угадал число.");
} else {
    alert(`К сожалению, ты не угадал. Загаданное число было ${randomNumber}.`);
}
const playBtn = document.getElementById("playBtn");
playBtn.addEventListener("click", function() {
    location.reload();
    alert("Игра началась заново! Угадайте число от 1 до 10:");
}
);
    </script>
</body>
</html>
